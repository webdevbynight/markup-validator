name: Install pnpm and setup Node.js
description: Composite action to install pnpm and setup Node.js used in several workflows

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        version: 11
        runtime: node@lts

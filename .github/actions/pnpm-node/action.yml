name: Install pnpm and setup Node.js
description: Composite action to install pnpm and setup Node.js used in several workflows

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 11
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "lts/*"
        cache: "pnpm"

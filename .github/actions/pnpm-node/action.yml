name: Install pnpm and setup Node.js
description: Composite action to install pnpm and setup Node.js used in several workflows

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        version: 12
        runtime: node@lts

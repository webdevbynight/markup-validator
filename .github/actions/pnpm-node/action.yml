name: Install pnpm and setup Node.js
description: Composite action to install pnpm and setup Node.js used in several workflows

runs:
  using: "composite"
  steps:
    - name: Install pnpm
      uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        version: 12
        runtime: node@lts
